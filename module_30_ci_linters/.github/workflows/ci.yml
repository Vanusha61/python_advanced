workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"

image: python:3.11

stages:
  - test

before_script:
  - pip install --upgrade pip
  - pip install -r requirements.txt

# Все команды выполняются из корня репозитория, поэтому пути указываем полные
unittest:
  stage: test
  script:
    - pytest module_30_ci_linters/homework/hw1/test -v

mypy:
  stage: test
  script:
    - mypy module_30_ci_linters/homework

black:
  stage: test
  script:
    - black --check --diff module_30_ci_linters/homework

isort:
  stage: test
  script:
    - isort --check-only --diff --profile black module_30_ci_linters/homework

flake8:
  stage: test
  script:
    - flake8 module_30_ci_linters/homework
