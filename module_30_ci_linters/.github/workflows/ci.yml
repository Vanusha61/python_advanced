name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy pytest
      - name: Lint with Black
        run: black --check --diff module_30_ci_linters/
      - name: Lint with isort
        run: isort --check-only --diff --profile black module_30_ci_linters/
      - name: Lint with flake8
        run: flake8 module_30_ci_linters/
      - name: Type check with mypy
        run: mypy module_30_ci_linters/
      - name: Run tests
        run: pytest module_30_ci_linters/homework/hw1/test -v
